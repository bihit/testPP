<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>AppBox</title>
  </head>
  <body>
    <h1>Willkommen bei AppBox</h1>
    <p>Ihre Emby-Server-Verwaltungslösung.</p>

    <div id="user-dashboard" style="display: none;">
      <h2>Benutzer-Dashboard</h2>
      <p>Willkommen, <span id="username-display"></span>!</p>
      <p>Emby-Server-Status: <span id="emby-status">Gestoppt</span></p>
      <button id="start-emby">Starten</button>
      <button id="stop-emby">Stoppen</button>
      <button id="restart-emby">Neustarten</button>
    </div>

    <div id="login-form">
      <h2>Anmelden</h2>
      <form id="loginUserForm">
        <label for="login-username">Benutzername:</label>
        <input type="text" id="login-username" name="username" required>
        <label for="login-password">Passwort:</label>
        <input type="password" id="login-password" name="password" required>
        <button type="submit">Anmelden</button>
      </form>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
