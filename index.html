<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Cinema Bay AppBox</title>
  </head>
  <body>
    <h1>Welcome to Cinema Bay AppBox</h1>
    <p>Your Emby server management solution.</p>

    <div id="user-dashboard" style="display: none;">
      <h2>User Dashboard</h2>
      <p>Welcome, <span id="username-display"></span>!</p>
      <p>Emby Server Status: <span id="emby-status">Stopped</span></p>
      <button id="start-emby">Start</button>
      <button id="stop-emby">Stop</button>
      <button id="restart-emby">Restart</button>
    </div>

    <div id="create-user-form">
        <h2>Create User</h2>
        <form id="createUserForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Create User</button>
        </form>
    </div>

    <div id="login-form">
      <h2>Login</h2>
      <form id="loginUserForm">
        <label for="login-username">Username:</label>
        <input type="text" id="login-username" name="username" required>
        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="password" required>
        <button type="submit">Login</button>
      </form>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
