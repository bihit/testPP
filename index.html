<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>AppBox</title>
  </head>
  <body>
    <h1>Willkommen bei AppBox</h1>
    <p>Ihre Emby-Server-Verwaltungslösung.</p>

    <div id="user-dashboard" style="display: none;">
      <h2>Benutzer-Dashboard</h2>
      <p>Willkommen, <span id="username-display"></span>!</p>
      <p>Emby-Server-Status: <span id="emby-status">Gestoppt</span></p>
      <button id="start-emby">Starten</button>
      <button id="stop-emby">Stoppen</button>
      <button id="restart-emby">Neustarten</button>
    </div>

    <div id="admin-dashboard" style="display: none;">
      <h2>Admin-Dashboard</h2>
      <h3>Benutzerliste</h3>
      <table id="user-list-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Benutzername</th>
            <th>Rolle</th>
            <th>Emby Port</th>
            <th>Ablaufdatum</th>
            <th>Status</th>
            <th>Server-Aktionen</th>
            <th>Benutzer-Aktionen</th>
          </tr>
        </thead>
        <tbody>
          <!-- User data will be inserted here -->
        </tbody>
      </table>
      <hr>
      <h3>Neuen Benutzer erstellen</h3>
      <form id="createUserForm">
        <label for="username">Benutzername:</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Passwort:</label>
        <input type="password" id="password" name="password" required>
        <label for="duration">Zugangsdauer (in Tagen):</label>
        <input type="number" id="duration" name="duration" min="1" value="30" required>
        <button type="submit">Benutzer erstellen</button>
      </form>
    </div>

    <div id="login-form">
      <h2>Anmelden</h2>
      <form id="loginUserForm">
        <label for="login-username">Benutzername:</label>
        <input type="text" id="login-username" name="username" required>
        <label for="login-password">Passwort:</label>
        <input type="password" id="login-password" name="password" required>
        <button type="submit">Anmelden</button>
      </form>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
